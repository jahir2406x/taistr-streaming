<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a0d12"/><stop offset="0.55" stop-color="#3a0f16"/><stop offset="1" stop-color="#1a0508"/>
    </linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e50914"/><stop offset="1" stop-color="#ff4d5e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#e50914" stop-opacity="0.28"/><stop offset="1" stop-color="#e50914" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Fondo rojizo -->
  <rect width="400" height="260" fill="url(#bg)"/>
  <rect width="400" height="260" fill="url(#glow)"/>

  <!-- Encabezado -->
  <rect x="40" y="34" width="150" height="12" rx="6" fill="#ffe3e6" opacity="0.92"/>
  <rect x="40" y="56" width="260" height="8" rx="4" fill="#ff9aa4" opacity="0.5"/>
  <rect x="40" y="70" width="210" height="8" rx="4" fill="#ff9aa4" opacity="0.5"/>

  <!-- Campo de correo simulado -->
  <rect x="40" y="104" width="320" height="40" rx="10" fill="#1a0508" stroke="#5a1b22" stroke-width="1.5"/>
  <text x="56" y="129" fill="#ff9aa4" font-family="Inter, Arial, sans-serif" font-size="13">tucorreo@ejemplo.com</text>

  <!-- Boton "Enviar email" (el anillo animado se dibuja por CSS encima) -->
  <rect x="118" y="176" width="164" height="52" rx="12" fill="url(#btn)"/>
  <text x="200" y="208" text-anchor="middle" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">Enviar email</text>
</svg>
